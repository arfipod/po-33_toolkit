plugins { id 'com.android.application' }
android {
    namespace 'com.arfipod.po33toolkit'
    compileSdk 36
    buildToolsVersion "36.0.0"
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.arfipod.po33toolkit'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        development {
            storeFile rootProject.file('signing/development.jks')
            storePassword 'android'
            keyAlias 'po33-development'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release { signingConfig signingConfigs.development; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
